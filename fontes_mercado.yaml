# Fontes do caderno Mercado. Mesmo formato do fontes.yaml da geral.
# Os NÚMEROS do painel (cotações, Medo & Ganância) não vêm daqui: vêm do comando
# "python main.py mercado-painel", direto das fontes de dados (ferramentas/mercado.py).
#
# A partir de 22/10/2026, o caderno Economia se juntou ao Mercado: as fontes dele estão no fim da lista, com
# os temas economia_brasil, economia_empresas e economia_mundo. Elas alimentam o bloco "#### ECONOMIA" das
# segundas, quartas e sextas (manual/MANUAL_MERCADO.md, seção 9). As que já existiam aqui (Valor Finanças,
# InfoMoney, Brazil Journal, Bloomberg Línea Brasil, Federal Reserve, CNBC e o radar) não foram repetidas.
# O painel de números oficiais (Selic, IPCA, PIB, desemprego, dívida, dólar e Focus) vem do comando
# "python main.py economia-painel DATA --caderno mercado" (ferramentas/economia.py), que também grava os
# releases e a agenda do IBGE em edicoes/mercado/DATA/oficiais.md.
#
# tema do Mercado: bolsa_br | bolsa_eua | juros | empresas
# tema do bloco Economia: economia_brasil | economia_empresas | economia_mundo

janela_horas:
  padrao: 24      # da manhã de ontem até agora
  segunda: 72     # pega a sexta e o fim de semana
  sabado: 24
  domingo: 24

limite_por_fonte: 12

# Ordem e nome das seções no arquivo de candidatos.
temas:
  bolsa_br: "Bolsa e mercado no Brasil"
  bolsa_eua: "EUA e mundo"
  empresas: "Empresas"
  juros: "Juros"
  economia_brasil: "ECONOMIA (bloco de segunda, quarta e sexta) · Brasil: juros, inflação, fiscal, câmbio, emprego e crescimento"
  economia_empresas: "ECONOMIA (bloco de segunda, quarta e sexta) · Empresas, setores, preços e consumo"
  economia_mundo: "ECONOMIA (bloco de segunda, quarta e sexta) · Economia global"

fontes:
  # ───────────── Brasil ─────────────
  - {nome: Valor Investe, tema: bolsa_br, tipo: imprensa, rss: "https://pox.globo.com/rss/valorinveste/", ativo: true}
  - {nome: Valor Finanças, tema: juros, tipo: imprensa, rss: "https://pox.globo.com/rss/valor/financas", ativo: true}
  - {nome: Money Times, tema: bolsa_br, tipo: imprensa, rss: "https://www.moneytimes.com.br/feed/", ativo: true}
  - {nome: InfoMoney, tema: bolsa_br, tipo: imprensa, rss: "https://www.infomoney.com.br/feed/", ativo: true}
  - {nome: Seu Dinheiro, tema: bolsa_br, tipo: imprensa, rss: "https://www.seudinheiro.com/feed/", ativo: true}
  - {nome: Exame Invest, tema: bolsa_br, tipo: imprensa, rss: "https://exame.com/invest/feed/", ativo: true}
  - {nome: InvestNews, tema: bolsa_br, tipo: imprensa, rss: "https://investnews.com.br/feed/", ativo: true}
  - {nome: Brazil Journal, tema: empresas, tipo: imprensa, rss: "https://braziljournal.com/feed/", ativo: true}
  - {nome: Bloomberg Línea Brasil, tema: empresas, tipo: imprensa, rss: "https://www.bloomberglinea.com.br/arc/outboundfeeds/rss/?outputType=xml", ativo: true}
  - {nome: Investing.com Brasil, tema: bolsa_br, tipo: imprensa, rss: "https://br.investing.com/rss/news.rss", ativo: true}

  # ───────────── EUA e mundo ─────────────
  - {nome: CNBC Mercados, tema: bolsa_eua, tipo: imprensa, rss: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", ativo: true}
  - {nome: CNBC Destaques, tema: bolsa_eua, tipo: imprensa, rss: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", ativo: true}
  - {nome: WSJ Mercados, tema: bolsa_eua, tipo: imprensa, rss: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain", ativo: true}
  - {nome: MarketWatch, tema: bolsa_eua, tipo: imprensa, rss: "https://feeds.content.dowjones.io/public/rss/mw_topstories", ativo: true}
  - {nome: Federal Reserve, tema: juros, tipo: primaria, rss: "https://www.federalreserve.gov/feeds/press_all.xml", ativo: true}

  # ═════════════ Bloco ECONOMIA (segunda, quarta e sexta) ═════════════
  # Janela de cada fonte: 48 h (da edição anterior até hoje) e 72 h na segunda (sexta, sábado e domingo).
  # Nas terças e quintas elas também são coletadas, mas o Mercado não lê estas seções.
  # Testadas uma a uma em 22/10/2026 no Mac, com janela de 96 h. Descartadas no teste do caderno Economia:
  #   InfoMoney Economia (feed vazio; fica o geral), Exame Economia e Negócios (404; o feed geral é quase só eleição),
  #   CNN Brasil Economia (404), Poder360 (XML inválido; o geral é política), Agência Gov (feed vazio),
  #   IBGE Agência de Notícias (anti-robô; entra pela API, no oficiais.md),
  #   Ministério da Fazenda e Tesouro (RSS com erro; ficam como página), Blog do IBRE (XML inválido),
  #   IFI do Senado (sem RSS), FMI (403 no RSS; fica como página), Banco Mundial (RSS 404; fica como página),
  #   Reuters (sem RSS aberto), AP (anti-robô), OCDE (anti-robô), Caixin (403),
  #   Mercado & Consumo (feed parado em agosto), Valor Agronegócios (parado desde 12/10), Calculated Risk (parado em janeiro).

