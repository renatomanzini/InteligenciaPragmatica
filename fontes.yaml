# Fontes especiais, lidas por API (não precisam de RSS).
especiais:
  hacker_news: {ativo: true, limite: 30}          # primeira página do Hacker News
  github_em_alta: {ativo: true, limite: 15, dias: 7}   # repositórios novos com mais estrelas
  hugging_face: {ativo: true, limite: 12}         # modelos e papers em alta
  reddit:
    ativo: true
    subreddits: [LocalLLaMA, singularity]
    limite: 10

