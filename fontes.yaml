# Fontes da Inteligência Pragmática.
# Para acrescentar uma fonte, copie um bloco e troque os valores.
# Para pausar uma fonte, mude "ativo: true" para "ativo: false".
#
# Campos:
#   nome   — como a fonte aparece na lista de candidatos
#   tema   — ia | economia | negocios | marketing | direito_tech | china | filosofia
#   tipo   — primaria (a própria empresa/governo/paper) | imprensa | analise | comunidade
#   rss    — endereço do feed (a coleta lê sozinha)
#   pagina — para fontes sem feed: a rotina visita a página na hora de apurar
#   ativo  — true | false

# Quantas horas para trás a coleta olha, por tipo de dia.
janela_horas:
  padrao: 30
  segunda: 78     # pega o fim de semana
  sabado: 168     # semana em revista
  domingo: 168

limite_por_fonte: 15

fontes:
