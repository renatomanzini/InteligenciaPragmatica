# Cadernos: newsletters especializadas, ao lado da geral (que continua no config.yaml).
# Cada caderno herda o config.yaml (site_url, horario_entrega...) e troca o que estiver aqui.
#
# Campos:
#   nome       — aparece no e-mail e no site
#   remetente  — nome de quem envia (o endereço é o mesmo da geral)
#   envio      — ligado | desligado (comece desligado e ligue depois das edições de teste)
#   fontes     — arquivo de fontes do caderno
#   manual     — manual de redação do caderno (complementa o da geral)
#   roteiro    — passo a passo da rotina do caderno

mercado:
  nome: "Inteligência Pragmática · Mercado"
  remetente: "IP · Mercado"
  envio: ligado
  fontes: fontes_mercado.yaml
  manual: manual/MANUAL_MERCADO.md
  roteiro: manual/ROTINA_MERCADO.md

niteroi:
  nome: "Inteligência Pragmática · Niterói"
  remetente: "IP · Niterói"
  envio: ligado
  dias_envio: [segunda, quarta, sexta]   # a rotina pesquisa todo dia; fora destes dias, só sai edição extra
  fontes: fontes_niteroi.yaml
  manual: manual/MANUAL_NITEROI.md
  roteiro: manual/ROTINA_NITEROI.md

# ENCERRADO em 22/10/2026: o caderno IA deixou de existir, porque a geral já cobre IA todo dia (matéria principal
# e "IA na prática"). As edições antigas e as páginas do site continuam aqui; os arquivos do caderno ficam só como histórico.
ia:
  nome: "Inteligência Pragmática · IA"
  remetente: "IP · IA"
  envio: desligado
  dias_envio: [segunda, quarta, sexta]   # (histórico) eram os dias fixos do caderno
  fontes: fontes_ia.yaml
  manual: manual/MANUAL_IA.md
  roteiro: manual/ROTINA_IA.md

# ENCERRADO em 22/10/2026: a Economia se juntou ao Mercado. Nas segundas, quartas e sextas, a edição do Mercado
# ganha o bloco "#### ECONOMIA" (macro do Brasil, micro, mundo e um explicador), com o painel oficial do BC e do IBGE
# (python main.py economia-painel DATA --caderno mercado). As edições antigas e as páginas do site continuam aqui;
# o manual, o roteiro e as fontes ficam só como histórico (o que vale está no MANUAL_MERCADO, seção 9).
economia:
  nome: "Inteligência Pragmática · Economia"
  remetente: "IP · Economia"
  envio: desligado
  dias_envio: [segunda, quarta, sexta]   # (histórico) eram os dias fixos; hoje são os dias do bloco ECONOMIA do Mercado
  fontes: fontes_economia.yaml
  manual: manual/MANUAL_ECONOMIA.md
  roteiro: manual/ROTINA_ECONOMIA.md

# ENCERRADO em 22/10/2026: o Marketing virou a seção "#### MARKETING DIGITAL" da geral, nas terças e quintas (que eram
# os dias fixos dele). As edições antigas e as páginas do site continuam aqui; o manual, o roteiro e as fontes ficam só como
# histórico (o que vale está no MANUAL_DE_REDACAO, seção 17, e no fontes.yaml, tema marketing).
marketing:
  nome: "Inteligência Pragmática · Marketing"
  remetente: "IP · Marketing"
  envio: desligado
  dias_envio: [terca, quinta]   # (histórico) hoje são os dias da seção MARKETING DIGITAL na geral
  fontes: fontes_marketing.yaml
  manual: manual/MANUAL_MARKETING.md
  roteiro: manual/ROTINA_MARKETING.md
